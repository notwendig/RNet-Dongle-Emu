name: CI

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake mingw-w64 libssl-dev

      - name: Python syntax and unit tests
        run: |
          python3 -m py_compile tools/rnet-bin2md.py
          python3 -m unittest discover -s tests -v

      - name: Build RND decryptor
        run: make -C tools

      - name: Configure MinGW32 emulator
        run: cmake --preset mingw32-release

      - name: Build MinGW32 emulator
        run: cmake --build --preset mingw32-release
