name: Build

on:
  push:
    branches: ["master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            g++ \
            mingw-w64 \
            qt6-base-dev \
            can-utils

      - name: Shell syntax
        run: bash -n start.sh

      - name: Build 32-bit FTD2XX/DongleInterface DLL
        run: |
          cmake -S . --preset mingw32-release
          cmake --build --preset mingw32-release --parallel

      - name: Build SocketCAN proxy
        run: |
          cmake -S tools/rnet-can-proxy -B build/rnet-can-proxy -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/rnet-can-proxy --parallel

      - name: Build Qt6 rollstuhl.emu
        run: |
          cmake -S rollstuhl.emu -B build/rollstuhl.emu -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/rollstuhl.emu --parallel
