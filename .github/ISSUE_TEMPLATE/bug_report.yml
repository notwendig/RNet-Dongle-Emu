name: Bug report
description: Report a reproducible parser/emulator problem
title: "[bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not upload proprietary binaries, customer configuration files, or unsanitized logs.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Minimal steps using sanitized/test data.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Fedora/Wine version, compiler, Programmer version
