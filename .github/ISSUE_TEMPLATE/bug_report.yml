name: Bug report
description: Reproducible freeR-Net problem
title: "[bug] "
labels: ["bug"]
body:
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options:
        - emu
        - real
        - build only
        - other
    validations:
      required: true

  - type: input
    id: commit
    attributes:
      label: Commit
      placeholder: git rev-parse --short HEAD

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Linux distribution, kernel, Wine version, CAN interfaces.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / CAN frames
      description: Attach only the smallest useful extracts. Remove personal data.

  - type: checkboxes
    id: safety
    attributes:
      label: Safety
      options:
        - label: I have read SAFETY.md for changes involving physical hardware or Power-On/Power-Off.
